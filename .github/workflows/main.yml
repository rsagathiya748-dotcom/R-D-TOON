name: Android Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Zip ko Extract karein
      run: unzip ToonRig.zip -d project_code
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build APK (Bina AIDE Premium)
      run: |
        cd project_code
        PROJECT_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: APK Download ke liye File banayein
      uses: actions/upload-artifact@v4
      with:
        name: toonrig-apk
        path: "**/*.apk"
