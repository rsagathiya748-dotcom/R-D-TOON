name: Android Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Zip ko Extract karein
      run: unzip ToonRig.zip -d project_code
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Compatible Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '6.9.4'
        
    - name: Build APK (Bina AIDE Premium)
      run: |
        cd project_code
        PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        
        # Root build.gradle setup
        cat << 'EOF' > "$PROJECT_DIR/build.gradle"
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:4.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        
        # App build.gradle ko pre-installed SDK 33 par set karein
        APP_GRADLE=$(find "$PROJECT_DIR" -name "build.gradle" | grep -v "$PROJECT_DIR/build.gradle" | head -n 1)
        sed -i 's/compileSdkVersion .*/compileSdkVersion 33/g' "$APP_GRADLE"
        sed -i 's/buildToolsVersion .*/buildToolsVersion "30.0.3"/g' "$APP_GRADLE"
        sed -i 's/targetSdkVersion .*/targetSdkVersion 33/g' "$APP_GRADLE"
        sed -i "s/compile fileTree/implementation fileTree/g" "$APP_GRADLE"
        sed -i "s/compile '/implementation '/g" "$APP_GRADLE"
        sed -i 's/compile "/implementation "/g' "$APP_GRADLE"
        
        cd "$PROJECT_DIR"
        gradle assembleDebug --no-daemon
        
    - name: APK Download ke liye File banayein
      uses: actions/upload-artifact@v4
      with:
        name: toonrig-apk
        path: "**/*.apk"
