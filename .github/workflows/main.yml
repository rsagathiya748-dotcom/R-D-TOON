name: Android Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Zip ko Extract karein
      run: unzip ToonRig.zip -d project_code
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Compatible Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '6.9.4'
        
    - name: Missing Android SDK Download Karein
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;30.0.3"
        
    - name: Build APK (Bina AIDE Premium)
      run: |
        cd project_code
        PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        
        # Root configuration
        cat << 'EOF' > "$PROJECT_DIR/build.gradle"
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:4.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        
        # App-level build.gradle ko modern standards par update karein
        APP_GRADLE="$PROJECT_DIR/app/build.gradle"
        sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 33/g' "$APP_GRADLE"
        sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 33/g' "$APP_GRADLE"
        sed -i 's/buildToolsVersion .*/buildToolsVersion "30.0.3"/g' "$APP_GRADLE"
        sed -i "s/compile '/implementation '/g" "$APP_GRADLE"
        
        cd "$PROJECT_DIR"
        gradle assembleDebug --no-daemon
        
    - name: APK Download ke liye File banayein
      uses: actions/upload-artifact@v4
      with:
        name: toonrig-apk
        path: "**/*.apk"
