name: Android Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Zip ko Extract karein
      run: unzip ToonRig.zip -d project_code
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Compatible Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '6.9.4'
        
    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
    - name: Build APK (Bina AIDE Premium)
      run: |
        cd project_code
        PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
        cd "$PROJECT_DIR"
        gradle assembleDebug --no-daemon
        
    - name: APK Download ke liye File banayein
      uses: actions/upload-artifact@v4
      with:
        name: toonrig-apk
        path: "**/*.apk"
